[project]
name = "CoMotion-X"
seed = 42

[simulation]
timestep_seconds = 0.01
duration_seconds = 10.0

[robot]
model_path = "third_party/mujoco_menagerie/franka_emika_panda/comotion_scene.xml"
move_duration_seconds = 1.5

[human]
scenario = "crossing"
duration_seconds = 4.0
frames_per_second = 30.0
noise_standard_deviation_m = 0.0
dropout_probability = 0.0

[estimation]
observation_noise_standard_deviation_m = 0.015
process_acceleration_standard_deviation_mps2 = 0.35
initial_velocity_standard_deviation_mps = 0.75

[prediction]
horizons_seconds = [0.1, 0.2, 0.3, 0.5]

[occupancy]
human_wrist_radius_m = 0.07
human_arm_radius_m = 0.06
human_torso_radius_m = 0.18
robot_link_radius_m = 0.055
robot_hand_radius_m = 0.075
uncertainty_sigma = 2.0

[safety]
warning_distance_m = 0.50
critical_distance_m = 0.25
slow_velocity_scale = 0.50
